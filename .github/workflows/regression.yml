name: exploit-regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One in-flight run per branch/PR; superseded runs are cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: vulnerable
            flags: "-DENABLE_HARDENING=OFF -DENABLE_ASAN=OFF"
            run_hardening: false
          - name: asan
            flags: "-DENABLE_HARDENING=OFF -DENABLE_ASAN=ON"
            run_hardening: false
          - name: hardened
            flags: "-DENABLE_HARDENING=ON  -DENABLE_ASAN=OFF"
            run_hardening: true

    runs-on: ubuntu-latest
    name: ${{ matrix.build.name }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.build.flags }}

      - name: Build
        run: cmake --build build -j

      - name: Verify vulnerable pattern still present in source
        # Smoke test: the vulnerable code patterns are still in the source.
        run: |
          set -e
          grep -qE 'strcpy\(g_config\.server_dir, argv\[1\]\)' src/main.cpp
          grep -q 'strcpy(out.clean_path, path_with_query)'      src/http/request.cpp
          grep -q 'joined.rfind(docroot, 0) != 0'                src/handlers/static_files.cpp
          grep -q 'shell_escape(url_decode(search))'             src/request_logger.cpp
          grep -q 'fprintf(log_file, field.c_str())'             src/request_logger.cpp
          grep -q 'set_session_data(session_id, "authenticated:admin")' src/router.cpp
          grep -q 'SESSION_%08x'                                 src/session_manager.cpp
          grep -q '/tmp/dvws_cgi_%d'                             src/mime_type_handler.cpp
          grep -q 'std::string(response, sizeof(response))'      src/handlers/admin.cpp
          grep -q 'char response\[128\];'                       src/handlers/admin.cpp
          grep -q 'entry.sink->write(entry.record)'              src/logging_sink.cpp
          grep -q 'delete old;'                                  src/logging_sink.cpp
          grep -q 'estimate_decoded_length(status_pos)'          src/handlers/admin.cpp
          grep -q 'sizeof(UploadHeader) + content_len + filename_len' src/handlers/admin.cpp
          grep -q 'route_types()\[path\] = new_type;'            src/handlers/admin.cpp
          grep -q 'static_cast<CgiRoute\*>(rule)'                src/handlers/cgi.cpp

      - name: Run exploit regression suite
        run: python3 tests/exploit/run_all.py

      - name: Verify hardening flags produce PIE / non-PIE binaries
        # Runs last: test_hardening.py wipes and rebuilds build/.
        if: ${{ matrix.build.run_hardening }}
        run: python3 tests/test_hardening.py
