# One-command CTF instance.
#
#   docker compose up --build
#
# Then browse http://localhost:8081 and start with CHALLENGES.md.
services:
  dvws:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    image: dvws-serve:latest
    container_name: dvws-serve
    ports:
      - "8081:8081"
    read_only: true
    tmpfs:
      # Temp-file challenge (CH-06) requires a writable /tmp.
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # These vulnerabilities are the whole point of this image. Do not
    # expose it beyond a trusted lab network.
    labels:
      dvws.warning: "intentionally-vulnerable-do-not-expose-publicly"
